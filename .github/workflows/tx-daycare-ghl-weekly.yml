name: TX daycare training citations -> GoHighLevel (daily)

# Runs daily 13:00 UTC (~8am Central). Also runnable on demand from the
# Actions tab (Run workflow), which is handy for a first live test.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print only, do NOT write to GoHighLevel)"
        type: boolean
        default: true
      days_back:
        description: "How many days back to pull"
        type: string
        default: "7"
      anchor:
        description: "auto = newest date in the feed; today = calendar date"
        type: choice
        options: [auto, today]
        default: auto
      exclude_ids:
        description: "Operation IDs to skip (comma-separated) e.g. tax-delinquent"
        type: string
        default: ""

jobs:
  load-citations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas

      - name: Load newly cited daycares into GoHighLevel
        env:
          GHL_TOKEN:              ${{ secrets.GHL_TOKEN }}
          GHL_LOCATION_ID:        ${{ secrets.GHL_LOCATION_ID }}
          WF_DIRECTOR_NURTURE:    ${{ secrets.WF_DIRECTOR_NURTURE }}
          WF_ORIENTATION_NURTURE: ${{ secrets.WF_ORIENTATION_NURTURE }}
          WF_STAFF_NURTURE:       ${{ secrets.WF_STAFF_NURTURE }}
          TX_APP_TOKEN:           ${{ secrets.TX_APP_TOKEN }}
          CLAY_WEBHOOK_URL:       ${{ secrets.CLAY_WEBHOOK_URL }}
          # "Run workflow" defaults this to true (safe preview). The scheduled
          # daily run has no input, so it is empty -> a real live run.
          DRY_RUN_FORCE:          ${{ inputs.dry_run }}
          DAYS_BACK:              ${{ inputs.days_back }}
          ANCHOR:                 ${{ inputs.anchor }}
          EXCLUDE_OPERATION_IDS:  ${{ inputs.exclude_ids }}
          # Scope: training-HOURS citations -- staff/caregiver annual training
          # + the director's own annual training + orientation.
          ALLOWED_VIOLATION_TYPES: "Orientation,Director training,Staff annual training"
          # Correction gate: "verified" skips citations HHS has already VERIFIED
          # as corrected, so we never email a provider who has fixed the issue.
          # ("off" = pursue all, which wrongly emailed already-corrected providers.)
          CORRECTION_FILTER: "verified"
          # Optional overrides (safe to omit -> defaults in weekly_agent.py):
          # TAG_DIRECTOR, TAG_ORIENTATION, TAG_STAFF, PRIORITY
        run: python weekly_agent.py
